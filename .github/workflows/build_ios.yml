  build-webapp-ios:
    name: Build Web-App IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies & Build Web
        run: |
          cd web-app
          npm install
          npm run build
          npx @capacitor/assets generate --assetPath public
          npx cap sync ios

      - name: Build iOS with Xcode (No Code Signing)
        run: |
          cd web-app/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r web-app/ios/App/build_derived/Build/Products/Release-iphoneos/App.app Payload/
          zip -r MeiiShop-WebApp.ipa Payload/
          echo "Web-App IPA created: MeiiShop-WebApp.ipa"
          ls -lh MeiiShop-WebApp.ipa

      - name: Upload Web-App IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeiiShop-WebApp-IPA-unsigned
          path: MeiiShop-WebApp.ipa
          retention-days: 14
